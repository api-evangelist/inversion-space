name: Inversion Space
description: 'Inversion Space is a Los Angeles-based aerospace and defense company
  founded in 2021 by Justin Fiaschetti and Austin Briggs, building autonomous, reusable,
  and low-cost reentry vehicles that turn space into a global logistics network. Its
  Arc vehicle is designed to store cargo in orbit and deliver a 500-pound payload to
  anywhere on Earth in under an hour, while its first spacecraft, Ray, validated key
  reentry subsystems. The company also develops hypersonic test capabilities and space-based
  interceptor technology, partnering with Anduril on the Golden Dome program and Kratos
  on the MACH-TB 2.0 hypersonic test program, backed by a $71M U.S. Space Force contract.
  It is in the API Evangelist network as a company profile; no public developer API,
  documentation, or SDK surface was found during enrichment.'
